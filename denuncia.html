    <main class="container-form">
        <h1>Disque Denúncia</h1>
        <p>Viu descarte irregular de lixo ou entulho em Mauá? Preencha o formulário abaixo para notificar as autoridades locais.</p>

        <form class="form-eco">
            <label for="nome">Seu Nome (Opcional):</label>
            <input type="text" id="nome" placeholder="Anônimo se preferir">

            <label for="bairro">Bairro / Local da ocorrência:</label>
            <input type="text" id="bairro" placeholder="Ex: Jardim Zaíra" required>

            <label for="descricao">Descrição do Problema:</label>
            <textarea id="descricao" rows="4" placeholder="Descreva o que foi descartado e pontos de referência..." required></textarea>

            <button type="submit" class="botao">Enviar Denúncia</button>
        </form>
    </main>
