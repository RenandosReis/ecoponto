    <main class="container-form">
        <h1>Disque Denúncia</h1>
        <p>Viu descarte irregular de lixo ou entulho em Mauá? Registre os detalhes da ocorrência abaixo.</p>

        <form class="form-eco" id="form-denuncia">
            <label for="nome">Seu Nome (Opcional):</label>
            <input type="text" id="nome" name="nome" placeholder="Anônimo se preferir" maxlength="120">

            <label for="bairro">Bairro / Local da ocorrência:</label>
            <input type="text" id="bairro" name="bairro" placeholder="Ex: Jardim Zaíra" maxlength="160" required>

            <label for="descricao">Descrição do Problema:</label>
            <textarea id="descricao" name="descricao" rows="4" maxlength="2000" placeholder="Descreva o que foi descartado e pontos de referência..." required></textarea>

            <button type="submit" class="botao">Enviar Denúncia</button>
        </form>
        <p id="status-denuncia" role="status" aria-live="polite"></p>
    </main>

    <script src="denuncia.js"></script>
</body>
